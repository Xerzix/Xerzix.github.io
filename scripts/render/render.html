<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumina render</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/garden.css">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #030203; }
  #scene { position: absolute; inset: -2%; transform-origin: 50% 60%; }
  #scene svg { width: 100%; height: 100%; }
  #petals { position: absolute; inset: 0; width: 100%; height: 100%; }
  #veil { position: absolute; inset: 0; background: radial-gradient(95% 75% at 50% 45%, transparent 35%, rgb(3 2 3 / 0.8) 100%); }
  #black { position: absolute; inset: 0; background: #000; }
  .card { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #f8f5f2; }
  .card .inner { display: flex; flex-direction: column; align-items: center; gap: 1.4vh; }
  .eyebrow { font: 600 1.35vh Inter, sans-serif; letter-spacing: .55em; margin-right: -.55em; color: #c6a46a; text-transform: uppercase; }
  .display { font: 500 10vh 'Cormorant Garamond', Georgia, serif; letter-spacing: .3em; margin-right: -.3em; line-height: 1;
             text-shadow: 0 0 3vh rgb(181 43 73 / .7), 0 0 8vh rgb(120 27 50 / .6); }
  .sub { font: 500 3.2vh 'Cormorant Garamond', Georgia, serif; letter-spacing: .12em; color: #ecdcd6; }
  .jp { font: 500 5vh 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif; letter-spacing: .6em; margin-right: -.6em; color: #c6a46a; }
  .credit { position: absolute; left: 0; right: 0; bottom: 9vh; text-align: center; font: 500 2vh Inter, sans-serif; letter-spacing: .4em; color: #b8b3b4; text-transform: uppercase; }
</style>
<script>
  // Deterministic randomness for reproducible renders.
  (() => {
    let s = 1234567;
    Math.random = () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    // The renderer drives time itself.
    window.requestAnimationFrame = () => 0;
  })();
</script>
<script type="module" src="./render.js"></script>
</head>
<body>
  <div id="stage">
    <div id="scene"></div>
    <canvas id="petals"></canvas>
    <div id="veil"></div>
    <div id="cards"></div>
    <div id="black"></div>
  </div>
</body>
</html>
