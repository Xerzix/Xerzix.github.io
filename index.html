<!doctype html>
<html lang="en" data-environment="sakura">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Lumina — a streaming garden for film and television, with Velvia Suggestions.">
  <meta name="color-scheme" content="dark">
  <title>Lumina</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&family=Shippori+Mincho:wght@500&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/garden.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/discovery.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/account.css">
  <link rel="stylesheet" href="css/velvia.css">
  <link rel="stylesheet" href="css/community.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-layout="app">
  <a class="lm-skip-link" href="#main">Skip to content</a>
  <div id="lm-garden" aria-hidden="true"></div>
  <canvas id="lm-petals-back" class="lm-petals lm-petals--back" aria-hidden="true"></canvas>
  <header id="lm-header"></header>
  <main id="main" tabindex="-1"></main>
  <footer id="lm-footer"></footer>
  <canvas id="lm-petals-front" class="lm-petals lm-petals--front" aria-hidden="true"></canvas>
  <div id="lm-toasts" class="lm-toasts" aria-live="polite"></div>
  <div id="lm-modals"></div>
  <div id="lm-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <noscript>
    <p style="padding:2rem;color:#f8f5f2;font-family:system-ui">Lumina needs JavaScript to browse and play titles.</p>
  </noscript>
</body>
</html>
