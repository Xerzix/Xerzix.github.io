<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Midnight Kitsune">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#2b0a14"/>
      <stop offset="0.6" stop-color="#11060a"/>
      <stop offset="1" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f4"/>
      <stop offset="1" stop-color="#e2dad3"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <circle cx="128" cy="130" r="98" fill="#781b32" opacity="0.22"/>
  <!-- mask -->
  <path d="M128 214c-30-8-56-34-62-74L54 46l46 40c8-4 18-6 28-6s20 2 28 6l46-40-12 94c-6 40-32 66-62 74z" fill="url(#mask)" stroke="#c6a46a" stroke-opacity="0.5" stroke-width="2"/>
