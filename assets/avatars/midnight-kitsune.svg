  <path d="M84 140c12-8 26-8 36 2-12 6-24 6-36-2z" fill="#080808"/>
  <path d="M172 140c-12-8-26-8-36 2 12 6 24 6 36-2z" fill="#080808"/>
  <path d="M78 132c14-14 30-14 42-4" fill="none" stroke="#b52b49" stroke-width="4" stroke-linecap="round"/>
  <path d="M178 132c-14-14-30-14-42-4" fill="none" stroke="#b52b49" stroke-width="4" stroke-linecap="round"/>
  <!-- cheek marks -->
  <path d="M86 164l20 6M84 174l20 2M170 164l-20 6M172 174l-20 2" stroke="#b52b49" stroke-width="3.5" stroke-linecap="round"/>
  <!-- nose and mouth -->
  <path d="M120 186c4 4 12 4 16 0-2 6-6 10-8 10s-6-4-8-10z" fill="#080808"/>
  <path d="M128 196v8" stroke="#780b20" stroke-width="2" stroke-linecap="round"/>
  <rect x="8" y="8" width="240" height="240" rx="30" fill="none" stroke="#c6a46a" stroke-opacity="0.38" stroke-width="2"/>
